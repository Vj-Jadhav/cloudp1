# ========================================================
# Render Blueprint (Infrastructure-as-Code)
# Student Information Management System - Backend Tier
# Deployed as a Docker container (see backend/Dockerfile)
# ========================================================
services:
  - type: web
    name: student-system-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 2
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_NAME
        value: student_db
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
