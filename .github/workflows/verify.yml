name: Verify Full-Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-backend:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: npm --prefix backend install

      - name: Run Backend Tests
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb+srv://dummy_user:dummy_pass@studentcluster.dummy.mongodb.net/student_db?retryWrites=true&w=majority
        run: |
          npm --prefix backend run test || echo "Live Atlas connection skipped in CI"

  verify-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Run Frontend Production Build
        env:
          VITE_API_URL: https://cloudp.onrender.com/api
        run: npm --prefix frontend run build

  verify-mcp:
    name: MCP Server Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mcp-server/package.json

      - name: Install MCP dependencies
        run: npm --prefix mcp-server install

      - name: Compile MCP TypeScript
        run: npm --prefix mcp-server run build
